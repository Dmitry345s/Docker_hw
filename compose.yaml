volumes:
    counter-memory:

services:
    app:
        build: .
        image: final-image
        ports:
            - "${HOST_PORT}:8000"
        environment:
            GREETING: "${GREETING}"
            STORAGE: redis
            REDIS_URL: redis://redis:6379/0
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 3s

    redis:
        image: redis:7.4-alpine
        volumes:
            - counter-memory:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-e", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 3s
